name: 'Process Pull Request'
on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'
permissions:
  contents: 'read'
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v5'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/pr_master.yaml'' && ''.github/workflows/pr_master.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/pr_master.yaml'''
  build-and-test:
    name: 'Build And Test'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    timeout-minutes: 30
    steps:
    - id: 'step-0'
      name: 'checkout'
      uses: 'actions/checkout@v5'
    - id: 'step-1'
      name: 'setup jdk'
      uses: 'actions/setup-java@v5'
      with:
        java-version: '25'
        distribution: 'corretto'
        java-package: 'jdk'
    - id: 'step-2'
      name: 'cache konan dir'
      uses: 'actions/cache@v4'
      with:
        path: '~/.konan/**/*'
        key: 'konan-${{ runner.os }}-${{ hashFiles(''**/*.gradle.kts'', ''gradle.properties'', ''versions.properties'') }}'
    - id: 'step-3'
      name: 'build with gradle'
      uses: 'gradle/actions/setup-gradle@v4'
      with:
        arguments: 'check'
